
name: HR Chatbot CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate HR Chatbot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required project files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js

      - name: Validate JavaScript syntax
        run: node --check script.js
